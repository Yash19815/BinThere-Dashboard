name: binthere-dashboard

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: binthere-dashboard:latest
    container_name: binthere-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-binthere-production-jwt-secret-change-me}
      - PROD_DB_DIR=/app/data
    volumes:
      - binthere_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"http.get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  binthere_data:
    driver: local


